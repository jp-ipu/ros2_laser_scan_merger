################################################################################
# ROS2 Laser Scan Merger - Configuration File
#
# This file configures the laser scan merger node which combines multiple
# laser scan sources into a single merged point cloud and laser scan output.
#
# The node uses TF2 transforms with optional caching for performance
#
# For ROS2 Jazzy - Best Practices Format
################################################################################

/ros2_laser_scan_merger:
  ros__parameters:
    # ============================================================================
    # General Settings
    # ============================================================================
    use_sim_time: false  # Set to true when using simulation time (e.g., from bag files)
    publish_rate: 30.0   # Publishing rate in Hz for merged point cloud

    # ============================================================================
    # Synchronization Settings (inspired by ira_laser_tools)
    # ============================================================================
    # Publishing mode: timer-based (default) or scan-triggered
    use_scan_triggering: false    # If true, publishes when scans arrive (not on timer)
    require_all_scans: false      # If true, waits for ALL lasers before publishing
                                   # (like ira_laser_tools hard synchronization)

    # Scan staleness detection
    max_scan_age: 1.0             # Maximum age in seconds before warning about stale scans
    skip_stale_scans: false       # If true, skip scans older than max_scan_age

    # ============================================================================
    # Transform Settings (TF2-based)
    # ============================================================================
    use_fixed_transforms: true    # RECOMMENDED: Cache TF transforms at startup
                                   # - true: Cache transforms once (fast, for fixed geometry)
                                   # - false: Dynamic TF lookup every scan (slower, for moving sensors)
    tf_timeout: 1.0               # TF lookup timeout in seconds

    # ============================================================================
    # Number of Laser Scanners
    # ============================================================================
    # Set this to the number of laser scanners you want to merge
    # The node will look for parameters laser0, laser1, laser2, etc.
    num_lasers: 2

    # ============================================================================
    # Topic Configuration
    # ============================================================================
    # Output topics
    pointCloudTopic: cloud_in        # Merged point cloud output topic
    destination_frame: laser         # Target frame for merged cloud (all scans transformed to this frame)

    # ============================================================================
    # Global Laser Parameters (applies to all lasers of the same type)
    # ============================================================================
    # These parameters are shared across all laser scanners since we assume
    # all lidars are the same model/type
    # Note: Can be overridden per-laser by specifying laserN.angle_min/angle_max

    # Angular Range Filtering (in degrees) - DEFAULTS for all lasers
    angle_min: -4.0                  # Minimum angle to include from all lasers (default)
    angle_max: 94.0                  # Maximum angle to include from all lasers (default)

    # Processing Flags
    flip: false                      # Flip the laser scan data
    inverse: true                    # Inverse the angle direction

    # ============================================================================
    # Laser Scanner 0 Configuration
    # ============================================================================
    laser0:
      # Topic Configuration
      topic: /lidar_1/scan            # Input laser scan topic
      # Note: source frame is automatically detected from scan->header.frame_id

      # Enable/disable this laser in the merged output
      show: true

      # Visualization Color (RGB 0-255)
      r: 255                          # Red channel
      g: 0                            # Green channel
      b: 0                            # Blue channel (displays as red)

    # ============================================================================
    # Laser Scanner 1 Configuration
    # ============================================================================
    laser1:
      # Topic Configuration
      topic: /lidar_2/scan            # Input laser scan topic
      # Note: source frame is automatically detected from scan->header.frame_id

      # Enable/disable this laser in the merged output
      show: true

      # Visualization Color (RGB 0-255)
      r: 0                            # Red channel
      g: 0                            # Green channel
      b: 255                          # Blue channel (displays as blue)

    # ============================================================================
    # Example: Laser Scanner 2 Configuration (if you have 3+ lasers)
    # ============================================================================
    # Uncomment and configure additional lasers as needed
    # Remember to set num_lasers to 3 or higher!
    #
    # laser2:
    #   topic: /lidar_3/scan           # Input topic (UNIQUE per laser)
    #   # Note: source frame detected from scan->header.frame_id
    #   show: true                     # Enable/disable (can vary per laser)
    #   r: 0                           # Red channel (can vary for visualization)
    #   g: 255                         # Green channel
    #   b: 0                           # Blue channel (displays as green)
    #
    #   # Optional: Per-laser angle filtering (overrides global angle_min/max)
    #   # Useful if this laser needs different angular range than others
    #   # angle_min: -10.0             # Custom min angle for this laser (degrees)
    #   # angle_max: 100.0             # Custom max angle for this laser (degrees)

    # ============================================================================
    # QoS Settings
    # ============================================================================
    # Quality of Service overrides for parameter events
    qos_overrides./parameter_events.publisher.depth: 1000
    qos_overrides./parameter_events.publisher.reliability: best_effort
    # qos_overrides./parameter_events.publisher.durability: volatile
    # qos_overrides./parameter_events.publisher.history: keep_last

################################################################################
# Pointcloud to LaserScan Conversion Node Configuration
################################################################################

/pointcloud_to_laserscan:
  ros__parameters:
    # ============================================================================
    # General Settings
    # ============================================================================
    use_sim_time: false  # Set to true when using simulation time

    # ============================================================================
    # Frame and Transform Settings
    # ============================================================================
    target_frame: laser           # Target frame for the output laser scan
    transform_tolerance: 0.01     # Transform tolerance in seconds

    # ============================================================================
    # Scan Parameters
    # ============================================================================
    # Angular resolution and range
    angle_min: -3.14              # Minimum scan angle in radians (~-180°)
    angle_max: 3.14               # Maximum scan angle in radians (~180°)
    angle_increment: 0.0087       # Angular resolution in radians (~0.5°)
    scan_time: 0.3333             # Time between scans in seconds (~3 Hz)

    # Distance filtering
    range_min: 0.35               # Minimum range in meters
    range_max: 10.0               # Maximum range in meters

    # Height filtering (Z-axis bounds for point cloud filtering)
    min_height: 0.0               # Minimum height in meters
    max_height: 1.0               # Maximum height in meters

    # ============================================================================
    # Processing Settings
    # ============================================================================
    use_inf: true                 # Use infinity for invalid ranges
    inf_epsilon: 1.0              # Epsilon for infinity comparison
    queue_size: 16                # Message queue size

    # ============================================================================
    # QoS Settings
    # ============================================================================
    qos_overrides:
      /parameter_events:
        publisher:
          depth: 1000
          reliability: best_effort
          # durability: volatile
          # history: keep_last

################################################################################
# SETUP GUIDE
################################################################################
#
# TF TREE REQUIREMENTS:
# ====================
# You MUST publish TF transforms from your robot's TF tree.
# The node automatically detects source frames from scan->header.frame_id
#
#   base_link (or your robot frame)
#       ├─> laser (destination_frame) - Target frame for merged output
#       │     ├─> lidar_1 (from scan header.frame_id)
#       │     └─> lidar_2 (from scan header.frame_id)
#
# Example using static_transform_publisher:
#   ros2 run tf2_ros static_transform_publisher 0 0 0 0 0 0 base_link laser
#   ros2 run tf2_ros static_transform_publisher -0.3 -0.475 0.176 0 0 0 laser lidar_1
#   ros2 run tf2_ros static_transform_publisher 0.3 0.475 0.176 0 0 3.14159 laser lidar_2
#
# Note: Frame IDs (lidar_1, lidar_2) must match what's published in scan->header.frame_id
# Or publish from your robot's URDF/robot_state_publisher
#
# PERFORMANCE MODES:
# ==================
# 1. FIXED TRANSFORMS (DEFAULT - RECOMMENDED):
#    use_fixed_transforms: true
#    - Caches TF transforms on first scan from each laser
#    - Extremely fast (no TF lookups after initial caching)
#    - Best for robots with fixed sensor positions
#    - ~1000x faster than dynamic lookups
#
# 2. DYNAMIC TRANSFORMS:
#    use_fixed_transforms: false
#    - Looks up TF every scan
#    - Slower but handles moving sensors (PTZ mounts, articulated platforms)
#    - Use for dynamic robot geometry
#
# SYNCHRONIZATION MODES:
# ======================
# 1. TIMER-BASED (DEFAULT):
#    use_scan_triggering: false
#    - Publishes at fixed rate (publish_rate parameter)
#    - More predictable, real-time friendly
#    - May use slightly stale scans
#
# 2. SCAN-TRIGGERED:
#    use_scan_triggering: true, require_all_scans: true
#    - Publishes only when ALL lasers have new data
#    - Best synchronization quality (like ira_laser_tools)
#    - Variable output rate depending on slowest laser
#
# N-LASER SUPPORT:
# ================
# - Supports any number of laser scanners (set via num_lasers)
# - All lasers assumed to be the SAME TYPE/MODEL
# - Global parameters (shared): angle_min, angle_max, flip, inverse
# - Per-laser parameters (unique):
#   * topic - Input scan topic (MUST be different)
#   * show - Enable/disable this laser (optional, default: true)
#   * r, g, b - Visualization color (optional, for distinguishing lasers)
#   * angle_min, angle_max - Optional per-laser angle filtering (overrides global)
# - Source frame automatically detected from scan->header.frame_id (not configured)
#
# PER-LASER ANGLE FILTERING:
# ==========================
# Each laser can optionally specify its own angle_min/angle_max:
#   laser0:
#     topic: /front_lidar/scan
#     angle_min: -10.0     # Custom range for front lidar
#     angle_max: 100.0
#   laser1:
#     topic: /rear_lidar/scan
#     # Uses global angle_min/max (no override specified)
# This is useful when lasers are mounted at different orientations or
# when you need different fields of view from each sensor.
#
# ANGLE UNITS:
# ============
# - Laser parameters (angle_min, angle_max): DEGREES
# - Pointcloud_to_laserscan: RADIANS
#
# QUALITY MONITORING:
# ===================
# - max_scan_age: Warns if scans are stale
# - skip_stale_scans: Optionally skip old scans
# - Timestamp spread warnings with require_all_scans
#
# ADVANTAGES OVER ira_laser_tools:
# =================================
# ✓ TF caching for fixed geometry (much faster)
# ✓ Still supports dynamic TF (set use_fixed_transforms: false)
# ✓ Better error handling and diagnostics
# ✓ Thread-safe with mutex protection
# ✓ Modern C++20 codebase
# ✓ Flexible synchronization modes
# ✓ Comprehensive quality monitoring
#
################################################################################
